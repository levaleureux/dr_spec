inherit_from:
  - .enabled.yml
  - .disabled.yml

AllCops:
  TargetRubyVersion: 2.6
  Exclude:
    - "spec_cli/**/*"
    - "bin/**/*"
    - "lib/dr_spec/tests_formater.rb"   # ANSI color tables, long lines expected
    - "lib/dr_spec/coverage/instrumenter.rb"  # source instrumentation, complex by nature
    - "poc/**/*"                        # proof of concept, not production code
  DisabledByDefault: true
