---
detectors:
  IrresponsibleModule:
    enabled: false
  TooManyMethods:
    enabled: false       # redundant with rubocop ClassLength
  Attribute:
    enabled: false       # standard DragonRuby pattern (attr_gtk)
  TooManyInstanceVariables:
    max_instance_variables: 8   # game components / test contexts need more
  NestedIterators:
    exclude: []
  DataClump:
    max_copies:      3
    min_clump_size:  3

directories:
  "spec":
    UtilityFunction:
      enabled: false
  "lib":
    InstanceVariableAssumption:
      enabled: false     # attr_gtk injects ivars at runtime
  "app":
    InstanceVariableAssumption:
      enabled: false

exclude_paths:
  - bin
  - spec_cli
